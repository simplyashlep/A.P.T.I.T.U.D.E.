name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - claude/judge-bias-beacon-scoring-8qAT3
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Enable Corepack (for Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build React site (premium UI)
        run: yarn build

      - name: Include brain docs and updated status in the deploy
        run: |
          mkdir -p _site/brain
          cp APTITUDE-BRAIN.md INCIDENT-INTAKE-DEMO.md PROJECT-STATUS.md README.md _site/brain/ || true
          # Also copy to root for easy access if the app serves static
          cp APTITUDE-BRAIN.md INCIDENT-INTAKE-DEMO.md _site/ || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name aptitude-site
