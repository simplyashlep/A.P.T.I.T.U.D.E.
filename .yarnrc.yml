# Yarn 4 (Berry) configuration for reliable CI / Cloudflare Pages builds

# Use classic node_modules instead of PnP for maximum compatibility
nodeLinker: node-modules

# Allow installs in CI even if the lockfile would be updated
# (prevents the exact error you are seeing: "The lockfile would have been modified...")
enableImmutableInstalls: false

# Optional but recommended: use a specific Yarn version
# yarnPath: .yarn/releases/yarn-4.5.0.cjs

# If you want zero-installs (commit the cache), set this and run yarn install
# enableGlobalCache: false
